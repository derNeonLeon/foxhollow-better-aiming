name: Cross-platform build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025-vs2026
            os: windows
            arch: x64
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            os: windows
            arch: arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Foxhollow
        shell: bash
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/JackPriceBurns/foxhollow.git .deps/foxhollow

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Install macOS build tools
        if: matrix.os == 'macos'
        run: brew install ninja

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.arch }}

      - name: Configure Windows
        if: matrix.os == 'windows'
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DFOXHOLLOW_SOURCE_DIR="${GITHUB_WORKSPACE}/.deps/foxhollow"
          -DBETTER_AIMING_PLATFORM=${{ matrix.platform }}

      - name: Configure Linux
        if: matrix.os == 'linux'
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DFOXHOLLOW_SOURCE_DIR="${GITHUB_WORKSPACE}/.deps/foxhollow"
          -DBETTER_AIMING_PLATFORM=${{ matrix.platform }}

      - name: Configure macOS
        if: matrix.os == 'macos'
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DFOXHOLLOW_SOURCE_DIR="${GITHUB_WORKSPACE}/.deps/foxhollow"
          -DBETTER_AIMING_PLATFORM=${{ matrix.platform }}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage
        shell: bash
        run: cmake --install build --prefix stage

      - uses: actions/upload-artifact@v4
        with:
          name: better-aiming-${{ matrix.platform }}
          path: stage/lib
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare package
        run: |
          mkdir -p package/lib
          cp mod.json package/mod.json

      - uses: actions/download-artifact@v4
        with:
          pattern: better-aiming-*
          path: package/lib
          merge-multiple: true

      - name: Package metadata
        id: package_meta
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("mod.json"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=better-aiming-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          (cd package && zip -r "../dist/${{ steps.package_meta.outputs.archive }}" mod.json lib)

      - uses: actions/upload-artifact@v4
        with:
          name: better-aiming-${{ steps.package_meta.outputs.version }}
          path: |
            package/mod.json
            package/lib
          if-no-files-found: error

      - name: Remove intermediate artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const intermediates = new Set([
              'better-aiming-windows-amd64',
              'better-aiming-windows-arm64',
              'better-aiming-linux-amd64',
              'better-aiming-linux-arm64',
              'better-aiming-macos-x86_64',
              'better-aiming-macos-arm64'
            ]);
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              }
            );
            for (const artifact of artifacts) {
              if (intermediates.has(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "dist/${{ steps.package_meta.outputs.archive }}" --clobber
